[package]
name = "kronos_pdv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
maud = { version = "0.27.0", features = ["axum"] }
nu-ansi-term = "0.50.3"
reqwest = { version = "0.13.4", features = ["json"] }
reqwest-middleware = "0.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sibyl = { version = "0.7.1", features = ["nonblocking", "tokio"] }
sqlx = { version = "0.9.0", features = ["mysql", "mysql-rsa", "runtime-tokio", "sqlite"] }
task-local-extensions = "0.1.4"
urlencoding = "2.1.3"
tokio = { version = "1.37.0", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
